<script>
(function(){
  var panel=document.getElementById('panel'), current='graphviz', scale={graphviz:0,d2:0};
  function svgOf(k){return document.querySelector('#v-'+k+' > svg');}
  function natural(svg){var vb=svg.viewBox&&svg.viewBox.baseVal; return vb&&vb.width?vb.width:svg.getBoundingClientRect().width;}
  function apply(){
    var svg=svgOf(current), w=natural(svg), fit=(panel.clientWidth-24)/w;
    var floor=current==='d2'?0.62:0.72; var s=scale[current]===0?Math.max(floor,Math.min(fit,1.4)):scale[current];
    svg.style.width=Math.round(w*s)+'px';
  }
  document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){
    current=b.getAttribute('data-show');
    document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
    document.getElementById('v-graphviz').hidden=current!=='graphviz';
    document.getElementById('v-d2').hidden=current!=='d2';
    apply(); panel.scrollTo(0,0);
  });});
  document.querySelectorAll('.zoom button').forEach(function(b){b.addEventListener('click',function(){
    var d=+b.getAttribute('data-zoom'), svg=svgOf(current), w=natural(svg);
    if(d===0){scale[current]=0;} else {var cur=svg.getBoundingClientRect().width/w; scale[current]=Math.max(.2,Math.min(3,cur*(d>0?1.25:0.8)));}
    apply();
  });});
  window.addEventListener('resize',apply); apply();
})();
</script>
