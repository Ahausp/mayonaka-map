<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Nhân vật & Địa điểm - Mayonaka Heart Tune</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            min-height: 650px; /* Cố định chiều cao tối thiểu cho Notion Embed */
        }

        #map-viewport {
            width: 100%;
            height: 100%;
            cursor: grab;
            position: relative;
            overflow: hidden;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 0);
            background-size: 24px 24px;
        }

        #map-viewport:active {
            cursor: grabbing;
        }

        #map-container {
            position: absolute;
            transform-origin: 0 0;
            transition: transform 0.05s ease-out;
            will-change: transform;
            width: 2000px;
            height: 2000px;
        }

        .node-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
        }

        .node-card:hover {
            transform: scale(1.05) translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        /* Connecting SVG lines glow */
        .connection-line {
            stroke-dasharray: 6;
            animation: dash 30s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -1000;
            }
        }

        /* Custom Scrollbar for Drawer */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="select-none">

    <!-- Header Controls & Filters -->
    <header class="absolute top-4 left-4 right-4 z-20 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
        <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 p-3 rounded-2xl shadow-xl pointer-events-auto flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-violet-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-pink-500/30">
                <i class="fa-solid font-bold fa-radio"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-base tracking-wide bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400 bg-clip-text text-transparent">
                    MAYONAKA HEART TUNE
                </h1>
                <p class="text-xs text-slate-400 font-medium">Bản đồ mối quan hệ & địa điểm</p>
            </div>
        </div>

        <!-- Category Filters -->
        <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 p-1.5 rounded-2xl shadow-xl pointer-events-auto flex items-center gap-1">
            <button onclick="filterNodes('all')" class="filter-btn active px-3 py-1.5 rounded-xl text-xs font-semibold bg-pink-500 text-white transition-all">Tất cả</button>
            <button onclick="filterNodes('character')" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition-all">Nhân vật</button>
            <button onclick="filterNodes('location')" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition-all">Địa điểm</button>
            <button onclick="filterNodes('mystery')" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition-all">Bí ẩn (Apollo)</button>
        </div>
    </header>

    <!-- Map Viewport -->
    <div id="map-viewport">
        <div id="map-container">
            <!-- SVG Line Connections -->
            <svg id="svg-connections" class="absolute inset-0 w-full h-full pointer-events-none z-0">
                <!-- Lines generated by JS -->
            </svg>

            <!-- Nodes Layer -->
            <div id="nodes-layer" class="relative w-full h-full z-10">
                <!-- Nodes generated by JS -->
            </div>
        </div>
    </div>

    <!-- Zoom & Map Action Tools -->
    <div class="absolute bottom-6 right-6 z-20 flex flex-col gap-2">
        <button onclick="zoomIn()" class="w-10 h-10 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center justify-center shadow-lg transition-all active:scale-95" title="Phóng to">
            <i class="fa-solid fa-plus"></i>
        </button>
        <button onclick="zoomOut()" class="w-10 h-10 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center justify-center shadow-lg transition-all active:scale-95" title="Thu nhỏ">
            <i class="fa-solid fa-minus"></i>
        </button>
        <button onclick="resetView()" class="w-10 h-10 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center justify-center shadow-lg transition-all active:scale-95" title="Về vị trí gốc">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
    </div>

    <!-- Detail Drawer Panel -->
    <div id="detail-drawer" class="fixed top-0 right-0 h-full w-full max-w-sm bg-slate-900/95 border-l border-slate-800/80 shadow-2xl z-30 transform translate-x-full transition-transform duration-300 ease-in-out backdrop-blur-xl flex flex-col">
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <span id="drawer-category" class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-slate-800 text-pink-400">Category</span>
            <button onclick="closeDrawer()" class="text-slate-400 hover:text-white w-8 h-8 rounded-lg bg-slate-800/50 hover:bg-slate-800 flex items-center justify-center transition-all">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="p-6 overflow-y-auto custom-scroll flex-1">
            <div id="drawer-icon" class="w-16 h-16 rounded-2xl mb-4 flex items-center justify-center text-2xl text-white shadow-lg"></div>
            <h2 id="drawer-title" class="text-2xl font-bold text-white mb-1">Title</h2>
            <p id="drawer-subtitle" class="text-sm font-medium text-slate-400 mb-4">Subtitle</p>
            <div class="h-px bg-slate-800 my-4"></div>
            <p id="drawer-desc" class="text-sm text-slate-300 leading-relaxed mb-6">Description goes here...</p>
            
            <div id="drawer-extra" class="space-y-3">
                <!-- Extra metadata inserted here -->
            </div>
        </div>
        <div class="p-4 border-t border-slate-800 bg-slate-950/50">
            <a id="drawer-link" href="#" target="_blank" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-lg shadow-pink-500/20 transition-all">
                <span>Xem chi tiết Wiki</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
            </a>
        </div>
    </div>

    <!-- JavaScript Data and Interactivity logic -->
    <script>
        // Data Nodes for Mayonaka Heart Tune
        const nodes = [
            {
                id: 'arisu',
                category: 'character',
                title: 'Yamabuki Arisu',
                subtitle: 'Nam chính / Quản lý CLB',
                x: 1000,
                y: 1000,
                icon: 'fa-user-tie',
                color: 'from-blue-500 to-indigo-600',
                desc: 'Học sinh trung học có khả năng cảm nhận giọng nói đặc biệt. Arisu luôn tìm cách giúp đỡ 4 cô gái phát triển tài năng và truy tìm tung tích của Apollo.',
                extra: [
                    { label: 'Vai trò', value: 'Quản lý / Đạo diễn phát thanh' },
                    { label: 'Mục tiêu', value: 'Xác định ai là Apollo trong số 4 cô gái' }
                ],
                url: 'https://mayonaka-heart-tune.fandom.com/'
            },
            {
                id: 'rikka',
                category: 'character',
                title: 'Inohana Rikka',
                subtitle: 'Ca sĩ (Singer)',
                x: 1250,
                y: 750,
                icon: 'fa-music',
                color: 'from-amber-500 to-orange-600',
                desc: 'Sở hữu giọng hát thiên bẩm mê đắm lòng người. Cô rũ bỏ những gượng ép quá khứ để tự do cất lên giai điệu chạm tới trái tim khán giả.',
                extra: [
                    { label: 'Kỹ năng', value: 'Hát live, Guitar, Sáng tác' },
                    { label: 'Nghi vấn Apollo', value: 'Độ nghi vấn: 85%' }
                ],
                url: 'https://mayonaka-heart-tune.fandom.com/'
            },
            {
                id: 'shinobu',
                category: 'character',
                title: 'Uzuki Shinobu',
                subtitle: 'Phát thanh viên (Broadcaster)',
                x: 750,
                y: 750,
                icon: 'fa-radio',
                color: 'from-pink-500 to-rose-600',
                desc: 'Phó chủ tịch hội học sinh kiêm Phó câu lạc bộ truyền thanh. Cô có giọng nói dịu dàng, kiên định và luôn gánh vác trách nhiệm chăm sóc mọi người.',
                extra: [
                    { label: 'Kỹ năng', value: 'Dẫn chương trình, Phát thanh, Lập kế hoạch' },
                    { label: 'Nghi vấn Apollo', value: 'Độ nghi vấn: 80%' }
                ],
                url: 'https://mayonaka-heart-tune.fandom.com/'
            },
            {
                id: 'nene',
                category: 'character',
                title: 'Himekawa Nene',
                subtitle: 'Diễn viên lồng tiếng (VA)',
                x: 750,
                y: 1250,
                icon: 'fa-microphone',
                color: 'from-purple-500 to-violet-600',
                desc: 'Nàng tsundere bướng bỉnh nhưng có tâm hồn nhạy cảm. Cô sở hữu chất giọng lồng tiếng ngọt ngào và đang nỗ lực hết mình để truyền cảm xúc thật vào nhân vật.',
                extra: [
                    { label: 'Kỹ năng', value: 'Lồng tiếng nhân vật, Biểu cảm giọng' },
                    { label: 'Nghi vấn Apollo', value: 'Độ nghi vấn: 90%' }
                ],
                url: 'https://mayonaka-heart-tune.fandom.com/'
            },
            {
                id: 'iko',
                category: 'character',
                title: 'Kirino Iko',
                subtitle: 'VTuber Streamer',
                x: 1250,
                y: 1250,
                icon: 'fa-headset',
                color: 'from-emerald-500 to-teal-600',
                desc: 'Ẩn sau hình tượng VTuber năng động là một cô gái rụt rè. Iko luôn kiên trì vượt qua nỗi sợ để mang tới những buổi livestream chân thật và gắn kết nhất.',
                extra: [
                    { label: 'Kỹ năng', value: 'Stream game, Tương tác Fan, Sáng tạo nội dung' },
                    { label: 'Nghi vấn Apollo', value: 'Độ nghi vấn: 75%' }
                ],
                url: 'https://mayonaka-heart-tune.fandom.com/'
            },
            {
                id: 'apollo',
                category: 'mystery',
                title: 'Apollo (Bí ẩn)',
                subtitle: 'Phát thanh viên đêm muộn',
                x: 1000,
                y: 600,
                icon: 'fa-moon',
                color: 'from-fuchsia-600 to-pink-600',
                desc: 'Chủ nhân kênh phát thanh "Mayonaka Heart Tune" phát sóng lúc 0 giờ đêm. Danh tính thực sự của cô chính là 1 trong 4 thành viên nữ.',
                extra: [
                    { label: 'Thời gian phát', value: '00:00 Đêm' },
                    { label: 'Trạng thái', value: 'Đang tìm kiếm danh tính' }
                ],
                url: 'https://mayonaka-heart-tune.fandom.com/'
            },
            {
                id: 'broadcast-club',
                category: 'location',
                title: 'Phòng Phát Thanh Trường',
                subtitle: 'Căn cứ hoạt động chính',
                x: 1000,
                y: 1400,
                icon: 'fa-building-user',
                color: 'from-cyan-500 to-blue-600',
                desc: 'Nơi các thành viên tụ họp mỗi ngày sau giờ học để thực hiện các chương trình radio và hỗ trợ lẫn nhau.',
                extra: [
                    { label: 'Địa điểm', value: 'Tầng 3 - Dãy nhà cũ' },
                    { label: 'Thiết bị', value: 'Mixer, Mic thu âm chuyên nghiệp' }
                ],
                url: 'https://mayonaka-heart-tune.fandom.com/'
            }
        ];

        const connections = [
            { from: 'arisu', to: 'shinobu', label: 'Hỗ trợ phát thanh' },
            { from: 'arisu', to: 'rikka', label: 'Quản lý âm nhạc' },
            { from: 'arisu', to: 'nene', label: 'Hỗ trợ Lồng tiếng' },
            { from: 'arisu', to: 'iko', label: 'Hỗ trợ Livestream' },
            { from: 'arisu', to: 'apollo', label: 'Tìm kiếm' },
            { from: 'arisu', to: 'broadcast-club', label: 'Hoạt động' },
            { from: 'apollo', to: 'shinobu', style: 'dashed' },
            { from: 'apollo', to: 'rikka', style: 'dashed' },
            { from: 'apollo', to: 'nene', style: 'dashed' },
            { from: 'apollo', to: 'iko', style: 'dashed' }
        ];

        // Pan Zoom State
        let scale = 0.95;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        let isDragging = false;

        const viewport = document.getElementById('map-viewport');
        const container = document.getElementById('map-container');

        // Center Initial View
        function centerInitialView() {
            const rect = viewport.getBoundingClientRect();
            pointX = (rect.width - 2000 * scale) / 2;
            pointY = (rect.height - 2000 * scale) / 2;
            updateTransform();
        }

        function updateTransform() {
            container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        // Mouse Drag Controls
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.node-card') || e.target.closest('#detail-drawer')) return;
            isDragging = true;
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Wheel Zoom Controls
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const xs = (e.clientX - pointX) / scale;
            const ys = (e.clientY - pointY) / scale;
            const delta = -e.deltaY;

            if (delta > 0) {
                scale = Math.min(scale * 1.15, 2.5);
            } else {
                scale = Math.max(scale / 1.15, 0.4);
            }

            pointX = e.clientX - xs * scale;
            pointY = e.clientY - ys * scale;
            updateTransform();
        });

        // Zoom Helpers
        function zoomIn() {
            scale = Math.min(scale * 1.25, 2.5);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale / 1.25, 0.4);
            updateTransform();
        }

        function resetView() {
            scale = 0.95;
            centerInitialView();
        }

        // Render Map Nodes and Connections
        function renderMap() {
            const nodesLayer = document.getElementById('nodes-layer');
            const svgLayer = document.getElementById('svg-connections');
            nodesLayer.innerHTML = '';
            svgLayer.innerHTML = '';

            // Draw Connections
            connections.forEach(conn => {
                const fromNode = nodes.find(n => n.id === conn.from);
                const toNode = nodes.find(n => n.id === conn.to);

                if (fromNode && toNode) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', fromNode.x);
                    line.setAttribute('y1', fromNode.y);
                    line.setAttribute('x2', toNode.x);
                    line.setAttribute('y2', toNode.y);
                    line.setAttribute('stroke', conn.style === 'dashed' ? 'rgba(236, 72, 153, 0.4)' : 'rgba(99, 102, 241, 0.4)');
                    line.setAttribute('stroke-width', conn.style === 'dashed' ? '2' : '3');
                    if (conn.style === 'dashed') {
                        line.classList.add('connection-line');
                    }
                    svgLayer.appendChild(line);
                }
            });

            // Draw Nodes
            nodes.forEach(node => {
                const card = document.createElement('div');
                card.className = `node-card absolute p-4 rounded-2xl bg-slate-900/90 border border-slate-700/80 text-white w-64 shadow-2xl cursor-pointer node-${node.category}`;
                card.style.left = `${node.x - 128}px`; // Centered
                card.style.top = `${node.y - 50}px`;
                
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr ${node.color} flex items-center justify-center text-xl text-white shadow-md flex-shrink-0">
                            <i class="fa-solid ${node.icon}"></i>
                        </div>
                        <div class="overflow-hidden">
                            <h3 class="font-bold text-sm text-slate-100 truncate">${node.title}</h3>
                            <p class="text-xs text-slate-400 truncate">${node.subtitle}</p>
                        </div>
                    </div>
                `;

                card.onclick = (e) => {
                    e.stopPropagation();
                    openDrawer(node);
                };

                nodesLayer.appendChild(card);
            });
        }

        // Drawer Operations
        function openDrawer(node) {
            const drawer = document.getElementById('detail-drawer');
            document.getElementById('drawer-category').innerText = node.category;
            document.getElementById('drawer-title').innerText = node.title;
            document.getElementById('drawer-subtitle').innerText = node.subtitle;
            document.getElementById('drawer-desc').innerText = node.desc;
            document.getElementById('drawer-link').href = node.url;

            const iconBox = document.getElementById('drawer-icon');
            iconBox.className = `w-16 h-16 rounded-2xl mb-4 flex items-center justify-center text-2xl text-white shadow-lg bg-gradient-to-tr ${node.color}`;
            iconBox.innerHTML = `<i class="fa-solid ${node.icon}"></i>`;

            const extraBox = document.getElementById('drawer-extra');
            extraBox.innerHTML = '';
            if (node.extra) {
                node.extra.forEach(item => {
                    extraBox.innerHTML += `
                        <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                            <div class="text-xs text-slate-400 font-medium">${item.label}</div>
                            <div class="text-sm font-semibold text-slate-200 mt-0.5">${item.value}</div>
                        </div>
                    `;
                });
            }

            drawer.classList.remove('translate-x-full');
        }

        function closeDrawer() {
            document.getElementById('detail-drawer').classList.add('translate-x-full');
        }

        // Filter Functionality
        function filterNodes(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-pink-500', 'text-white');
                btn.classList.add('text-slate-300');
            });
            event.target.classList.add('bg-pink-500', 'text-white');

            const cards = document.querySelectorAll('.node-card');
            cards.forEach(card => {
                if (type === 'all' || card.classList.contains(`node-${type}`)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Initialize on Load
        window.addEventListener('load', () => {
            renderMap();
            centerInitialView();
        });
    </script>
</body>
</html>
